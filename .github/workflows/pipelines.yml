name: 🚀 Boogo CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: 🧪 Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: 🧹 Linting
        run: go fmt ./... && go vet ./...

      - name: 🧪 Run Golden Tests
        run: go test -v ./...
