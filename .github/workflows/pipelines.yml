name: 🚀 Boogo CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 🧪 Step 1: Quality Control
  quality-gate:
    name: 🧪 Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: 🧹 Linting
        run: go fmt ./... && go vet ./...

      - name: 🧪 Run Golden Tests
        run: go test -v ./...

  # 🚢 Step 2: Conditional Deployment
  deploy:
    name: 🚀 Deploy to Production
    needs: quality-gate
    if: |
      contains(github.event.head_commit.message, ':rocket:') || 
      contains(github.event.head_commit.message, '🚀')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔨 Build Binary
        run: go build -o boogo cmd/main.go

      - name: 📦 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boogo-binary
          path: boogo

      - name: 🌐 Actual Deployment
        run: echo "Deploying Boogo to production server..."
